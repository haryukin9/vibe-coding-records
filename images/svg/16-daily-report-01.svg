<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="AIに今日やったことを聞いたら、返ってきた作業はすべて自分が指示したものだった、という構図">
  <rect x="0" y="0" width="1920" height="1080" fill="#f8f9fa"/>

  <!-- タイトル -->
  <text x="80" y="80" font-family="sans-serif" font-size="60" font-weight="bold" fill="#1f2937" dominant-baseline="hanging">AIに聞いたのに、答えは自分の記録</text>
  <line x1="80" y1="172" x2="520" y2="172" stroke="#f59e0b" stroke-width="5"/>

  <!-- 左：質問カード -->
  <rect x="80" y="270" width="470" height="300" rx="24" fill="#fff" stroke="#5da8d4" stroke-width="3"/>
  <rect x="80" y="270" width="470" height="78" rx="24" fill="#5da8d4"/>
  <rect x="80" y="320" width="470" height="28" fill="#5da8d4"/>
  <text x="315" y="309" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="sans-serif" font-size="40" font-weight="bold">AIへの質問</text>
  <text x="315" y="430" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#1f2937">「今日君は</text>
  <text x="315" y="500" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="bold" fill="#1f2937">何をやった?」</text>

  <!-- 矢印1 -->
  <line x1="560" y1="420" x2="690" y2="420" stroke="#3a7ba8" stroke-width="7"/>
  <polygon points="690,400 730,420 690,440" fill="#3a7ba8"/>

  <!-- 中：AIが返したリスト -->
  <rect x="740" y="270" width="540" height="300" rx="24" fill="#fff" stroke="#5da8d4" stroke-width="3"/>
  <rect x="740" y="270" width="540" height="78" rx="24" fill="#5da8d4"/>
  <rect x="740" y="320" width="540" height="28" fill="#5da8d4"/>
  <text x="1010" y="309" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="sans-serif" font-size="40" font-weight="bold">返ってきた作業リスト</text>
  <text x="790" y="412" font-family="sans-serif" font-size="42" fill="#374151">・記事を1本書いた</text>
  <text x="790" y="478" font-family="sans-serif" font-size="42" fill="#374151">・図を4枚作った</text>
  <text x="790" y="544" font-family="sans-serif" font-size="42" fill="#374151">・メルマガを配信した</text>

  <!-- 矢印2 -->
  <line x1="1290" y1="420" x2="1420" y2="420" stroke="#3a7ba8" stroke-width="7"/>
  <polygon points="1420,400 1460,420 1420,440" fill="#3a7ba8"/>

  <!-- 右：気づき -->
  <rect x="1470" y="270" width="370" height="300" rx="24" fill="#eff6ff" stroke="#3a7ba8" stroke-width="3"/>
  <text x="1655" y="370" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#3a7ba8">でも、全部</text>
  <text x="1655" y="440" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#3a7ba8">自分が</text>
  <text x="1655" y="510" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#3a7ba8">指示したこと</text>

  <!-- 強調基盤：AIの日報＝自分の日報 -->
  <rect x="80" y="660" width="1760" height="190" rx="24" fill="#fef3e2" stroke="#f59e0b" stroke-width="3"/>
  <rect x="80" y="660" width="1760" height="70" rx="24" fill="#f59e0b"/>
  <rect x="80" y="700" width="1760" height="30" fill="#f59e0b"/>
  <text x="960" y="695" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="sans-serif" font-size="40" font-weight="bold">だから</text>
  <text x="960" y="795" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="56" font-weight="bold" fill="#92400e">AIの日報は、そのまま「自分の日報」になっていた</text>

  <!-- フッターキャッチ -->
  <rect x="80" y="970" width="1760" height="72" rx="20" fill="#ffffff" stroke="#fde6c1" stroke-width="3"/>
  <circle cx="130" cy="1006" r="10" fill="#f59e0b"/>
  <text x="170" y="1006" font-family="sans-serif" font-size="34" fill="#374151" dominant-baseline="central">打ち合わせや電話などAIの外の仕事もあるが、1日の動きの8割以上はこれでカバーできる。</text>
</svg>
