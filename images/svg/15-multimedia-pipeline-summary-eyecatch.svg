<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="3か月で、会社のマーケティングと営業をAIで全面的に作り直した話">
  <rect width="1280" height="720" fill="#f8f9fa"/>

  <!-- 上部 -->
  <text x="80" y="60" fill="#5da8d4" font-weight="600" font-size="22" letter-spacing="3" dominant-baseline="hanging">中小企業のひとりDX担当が、AIで会社をアップデートする</text>
  <line x1="80" y1="105" x2="220" y2="105" stroke="#5da8d4" stroke-width="3"/>
  <text x="1200" y="60" text-anchor="end" fill="#f59e0b" font-weight="700" font-size="26" letter-spacing="2" dominant-baseline="hanging">#15 — まとめ</text>

  <!-- メインタイトル -->
  <text x="80" y="180" font-weight="700" font-size="72" dominant-baseline="hanging">
    <tspan fill="#1f2937">マーケと営業を</tspan>
  </text>
  <text x="80" y="278" font-weight="700" font-size="72" dominant-baseline="hanging">
    <tspan fill="#f59e0b">AI</tspan><tspan fill="#1f2937">で全面的に</tspan>
  </text>
  <text x="80" y="376" font-weight="700" font-size="72" dominant-baseline="hanging">
    <tspan fill="#f59e0b">作り直した</tspan>
  </text>

  <!-- サブタイトル -->
  <text x="80" y="498" fill="#3a7ba8" font-weight="600" font-size="24" letter-spacing="1">— 3か月・ひとりで・外注なら約400万円が0円に</text>

  <!-- 右側：3か月で内製したもの（内訳3つ） -->
  <g transform="translate(760, 150)">
    <text x="240" y="-20" text-anchor="middle" fill="#6b7280" font-size="17" font-weight="600">3か月で内製したもの</text>

    <!-- 記事 -->
    <rect x="60" y="0" width="360" height="76" rx="12" fill="#fff" stroke="#5da8d4" stroke-width="2.5"/>
    <g transform="translate(86, 20) scale(1.4)" fill="#5da8d4">
      <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 7h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z"/>
    </g>
    <text x="150" y="38" dominant-baseline="central" fill="#1f2937" font-weight="700" font-size="26">記事</text>
    <text x="396" y="40" text-anchor="end" dominant-baseline="central" fill="#f59e0b" font-weight="800" font-size="42">50<tspan font-size="22" fill="#92400e">本</tspan></text>

    <!-- 動画 -->
    <rect x="60" y="92" width="360" height="76" rx="12" fill="#fff" stroke="#5da8d4" stroke-width="2.5"/>
    <g transform="translate(86, 112) scale(1.4)" fill="#5da8d4">
      <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
    </g>
    <text x="150" y="130" dominant-baseline="central" fill="#1f2937" font-weight="700" font-size="26">動画</text>
    <text x="396" y="132" text-anchor="end" dominant-baseline="central" fill="#f59e0b" font-weight="800" font-size="42">10<tspan font-size="22" fill="#92400e">本</tspan></text>

    <!-- ツール -->
    <rect x="60" y="184" width="360" height="76" rx="12" fill="#fef3e2" stroke="#f59e0b" stroke-width="2.5"/>
    <g transform="translate(86, 204) scale(1.4)" fill="#f59e0b">
      <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
    </g>
    <text x="150" y="222" dominant-baseline="central" fill="#92400e" font-weight="700" font-size="26">ツール</text>
    <text x="396" y="224" text-anchor="end" dominant-baseline="central" fill="#f59e0b" font-weight="800" font-size="42">14<tspan font-size="22" fill="#92400e">本</tspan></text>
  </g>

  <!-- フッターキャッチ -->
  <g>
    <rect x="160" y="608" width="960" height="60" rx="30" fill="#fff" stroke="#fde6c1" stroke-width="1.5"/>
    <circle cx="200" cy="638" r="7" fill="#f59e0b"/>
    <text x="226" y="638" dominant-baseline="central" fill="#1f2937" font-weight="600" font-size="22" letter-spacing="0.5">土台のWebから、集める・答える・育てる・決める・測るまで作り直した</text>
  </g>
</svg>
