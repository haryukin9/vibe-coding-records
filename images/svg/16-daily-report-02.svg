<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="週ごとの、1本あたりの制作時間とやり取りのテンポの推移。時間は直近2週で半分近くに下がり、テンポは上がっている">
  <rect x="0" y="0" width="1920" height="1080" fill="#f8f9fa"/>

  <!-- タイトル -->
  <text x="80" y="80" font-family="sans-serif" font-size="60" font-weight="bold" fill="#1f2937" dominant-baseline="hanging">同じ時間で作れる量が、ほぼ倍になった</text>
  <line x1="80" y1="172" x2="520" y2="172" stroke="#f59e0b" stroke-width="5"/>

  <!-- 左：凡例（線の名前） -->
  <line x1="90" y1="465" x2="150" y2="465" stroke="#f59e0b" stroke-width="8"/>
  <circle cx="120" cy="465" r="11" fill="#f59e0b"/>
  <text x="165" y="465" font-family="sans-serif" font-size="32" fill="#b45309" font-weight="bold" dominant-baseline="central">1本あたりの時間</text>
  <line x1="90" y1="545" x2="150" y2="545" stroke="#5da8d4" stroke-width="8"/>
  <circle cx="120" cy="545" r="11" fill="#5da8d4"/>
  <text x="165" y="545" font-family="sans-serif" font-size="32" fill="#3a7ba8" font-weight="bold" dominant-baseline="central">やり取りのテンポ</text>

  <!-- 直近2週ハイライト帯 -->
  <rect x="1373" y="240" width="427" height="580" fill="#fef3e2"/>
  <text x="1586" y="282" font-family="sans-serif" font-size="38" fill="#b45309" text-anchor="middle" font-weight="bold">直近2週</text>

  <!-- プロット枠下線 -->
  <line x1="420" y1="820" x2="1820" y2="820" stroke="#d1d5db" stroke-width="3"/>

  <!-- やり取りのテンポ（青・上がる） -->
  <polyline points="470,579 728,565 986,447 1244,327 1502,400 1760,359" fill="none" stroke="#5da8d4" stroke-width="8"/>
  <circle cx="470" cy="579" r="12" fill="#5da8d4"/>
  <circle cx="728" cy="565" r="12" fill="#5da8d4"/>
  <circle cx="986" cy="447" r="12" fill="#5da8d4"/>
  <circle cx="1244" cy="327" r="12" fill="#5da8d4"/>
  <circle cx="1502" cy="400" r="12" fill="#5da8d4"/>
  <circle cx="1760" cy="359" r="12" fill="#5da8d4"/>
  <text x="1760" y="300" font-family="sans-serif" font-size="40" fill="#3a7ba8" text-anchor="middle" font-weight="bold">約2倍に</text>

  <!-- 1本あたりの時間（オレンジ・下がる） -->
  <polyline points="470,410 728,388 986,410 1244,388 1502,539 1760,604" fill="none" stroke="#f59e0b" stroke-width="8"/>
  <circle cx="470" cy="410" r="12" fill="#f59e0b"/>
  <circle cx="728" cy="388" r="12" fill="#f59e0b"/>
  <circle cx="986" cy="410" r="12" fill="#f59e0b"/>
  <circle cx="1244" cy="388" r="12" fill="#f59e0b"/>
  <circle cx="1502" cy="539" r="12" fill="#f59e0b"/>
  <circle cx="1760" cy="604" r="12" fill="#f59e0b"/>
  <text x="470" y="365" font-family="sans-serif" font-size="38" fill="#b45309" text-anchor="middle" font-weight="bold">約2.0h</text>
  <text x="1760" y="662" font-family="sans-serif" font-size="38" fill="#b45309" text-anchor="middle" font-weight="bold">約1.0h</text>

  <!-- 週ラベル -->
  <text x="470" y="858" font-family="sans-serif" font-size="42" fill="#374151" text-anchor="middle" dominant-baseline="hanging">1週目</text>
  <text x="728" y="858" font-family="sans-serif" font-size="42" fill="#374151" text-anchor="middle" dominant-baseline="hanging">2週目</text>
  <text x="986" y="858" font-family="sans-serif" font-size="42" fill="#374151" text-anchor="middle" dominant-baseline="hanging">3週目</text>
  <text x="1244" y="858" font-family="sans-serif" font-size="42" fill="#374151" text-anchor="middle" dominant-baseline="hanging">4週目</text>
  <text x="1502" y="858" font-family="sans-serif" font-size="42" fill="#374151" text-anchor="middle" dominant-baseline="hanging">5週目</text>
  <text x="1760" y="858" font-family="sans-serif" font-size="42" fill="#374151" text-anchor="middle" dominant-baseline="hanging">6週目</text>

  <!-- フッターキャッチ -->
  <rect x="80" y="970" width="1760" height="72" rx="20" fill="#ffffff" stroke="#fde6c1" stroke-width="3"/>
  <circle cx="130" cy="1006" r="10" fill="#f59e0b"/>
  <text x="170" y="1006" font-family="sans-serif" font-size="34" fill="#374151" dominant-baseline="central">慣れるほど、1本にかかる時間は短くなり、やり取りのテンポはむしろ上がっていった。</text>
</svg>
