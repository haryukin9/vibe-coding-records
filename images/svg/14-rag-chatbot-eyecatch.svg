<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="自社サイトの問い合わせAIチャット（RAG）を、非エンジニアがClaude Codeで内製した話">
  <rect width="1280" height="720" fill="#f8f9fa"/>

  <!-- 上部 -->
  <text x="80" y="60" fill="#5da8d4" font-weight="600" font-size="22" letter-spacing="3" dominant-baseline="hanging">中小企業のひとりDX担当が、AIで会社をアップデートする</text>
  <line x1="80" y1="105" x2="220" y2="105" stroke="#5da8d4" stroke-width="3"/>
  <text x="1200" y="60" text-anchor="end" fill="#f59e0b" font-weight="700" font-size="26" letter-spacing="2" dominant-baseline="hanging">#14 — RAG</text>

  <!-- メインタイトル -->
  <text x="80" y="180" font-weight="700" font-size="72" dominant-baseline="hanging">
    <tspan fill="#f59e0b">出典付き</tspan><tspan fill="#1f2937">で答える</tspan>
  </text>
  <text x="80" y="278" font-weight="700" font-size="72" dominant-baseline="hanging">
    <tspan fill="#f59e0b">AIチャット</tspan><tspan fill="#1f2937">を</tspan>
  </text>
  <text x="80" y="376" font-weight="700" font-size="72" dominant-baseline="hanging">
    <tspan fill="#1f2937">ゼロから</tspan><tspan fill="#f59e0b">内製</tspan>
  </text>

  <!-- サブタイトル -->
  <text x="80" y="498" fill="#3a7ba8" font-weight="600" font-size="24" letter-spacing="1">— 既製サービスを使わず、月コスト数百円で</text>

  <!-- 右側：質問→自社記事を探す→出典付きで回答 -->
  <g transform="translate(760, 150)">
    <text x="240" y="-20" text-anchor="middle" fill="#6b7280" font-size="17" font-weight="600">自社の記事から答える</text>

    <!-- 質問 -->
    <rect x="60" y="0" width="360" height="68" rx="12" fill="#eff6ff" stroke="#5da8d4" stroke-width="2.5"/>
    <g transform="translate(82, 18) scale(1.4)" fill="#5da8d4">
      <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
    </g>
    <text x="148" y="26" dominant-baseline="central" fill="#3a7ba8" font-weight="700" font-size="22">質問</text>
    <text x="148" y="52" dominant-baseline="central" fill="#5da8d4" font-size="14">料金は？ 似た事例は？</text>

    <!-- 矢印 -->
    <line x1="240" y1="68" x2="240" y2="98" stroke="#3a7ba8" stroke-width="3"/>
    <polygon points="240,106 231,92 249,92" fill="#3a7ba8"/>

    <!-- 検索 -->
    <rect x="60" y="106" width="360" height="68" rx="12" fill="#fef3e2" stroke="#f59e0b" stroke-width="2.5"/>
    <g transform="translate(82, 124) scale(1.4)" fill="#f59e0b">
      <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </g>
    <text x="148" y="132" dominant-baseline="central" fill="#f59e0b" font-weight="700" font-size="22">近い記事を探す</text>
    <text x="148" y="158" dominant-baseline="central" fill="#92400e" font-size="14">実績・コラム・料金</text>

    <!-- 矢印 -->
    <line x1="240" y1="174" x2="240" y2="204" stroke="#3a7ba8" stroke-width="3"/>
    <polygon points="240,212 231,198 249,198" fill="#3a7ba8"/>

    <!-- 回答 -->
    <rect x="60" y="212" width="360" height="76" rx="12" fill="#fff" stroke="#5da8d4" stroke-width="2.5"/>
    <g transform="translate(82, 232) scale(1.4)" fill="#5da8d4">
      <path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>
    </g>
    <text x="148" y="240" dominant-baseline="central" fill="#3a7ba8" font-weight="700" font-size="22">出典付きで回答</text>
    <text x="148" y="266" dominant-baseline="central" fill="#5da8d4" font-size="14">根拠の記事リンクを添える</text>
  </g>

  <!-- フッターキャッチ -->
  <g>
    <rect x="160" y="608" width="960" height="60" rx="30" fill="#fff" stroke="#fde6c1" stroke-width="1.5"/>
    <circle cx="200" cy="638" r="7" fill="#f59e0b"/>
    <text x="226" y="638" dominant-baseline="central" fill="#1f2937" font-weight="600" font-size="22" letter-spacing="0.5">記事という答えを、必要な人へその場で手渡す</text>
  </g>
</svg>
