<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ナレーションの長さに、映像を自動でそろえる">
  <rect width="1920" height="1080" fill="#f8f9fa"/>

  <text x="80" y="80" fill="#1f2937" font-weight="700" font-size="62" dominant-baseline="hanging">ナレーションの長さに、映像を自動でそろえる</text>
  <line x1="80" y1="172" x2="280" y2="172" stroke="#f59e0b" stroke-width="5"/>

  <!-- ① 全文ナレーション -->
  <text x="160" y="250" fill="#6b7280" font-weight="600" font-size="38">① 台本を全文、一度に読み上げる</text>
  <rect x="160" y="288" width="1600" height="92" rx="46" fill="#dbeafe" stroke="#5da8d4" stroke-width="3"/>
  <g transform="translate(210, 312) scale(2.0)" fill="#3a7ba8">
    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
  </g>
  <text x="980" y="334" text-anchor="middle" dominant-baseline="central" fill="#3a7ba8" font-weight="700" font-size="40">ナレーション音声（記事の要約）</text>

  <!-- ② 自動分割 -->
  <text x="960" y="438" text-anchor="middle" fill="#6b7280" font-weight="600" font-size="38">② 文の切れ目で、場面ごとに自動分割</text>
  <line x1="960" y1="468" x2="960" y2="512" stroke="#3a7ba8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="960,528 944,500 976,500" fill="#3a7ba8"/>

  <!-- ③ 各場面の長さ＝映像の尺 -->
  <text x="960" y="566" text-anchor="middle" fill="#6b7280" font-weight="600" font-size="38">③ それぞれの長さを、そのまま映像の尺に使う</text>

  <!-- 場面1 -->
  <rect x="250" y="610" width="360" height="60" rx="30" fill="#5da8d4"/>
  <text x="430" y="640" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700" font-size="32">6秒</text>
  <rect x="250" y="682" width="360" height="150" rx="16" fill="#fff" stroke="#5da8d4" stroke-width="3"/>
  <polygon points="416,737 416,777 452,757" fill="#5da8d4"/>
  <text x="430" y="868" text-anchor="middle" fill="#1f2937" font-weight="600" font-size="34">場面1</text>

  <!-- 場面2 -->
  <rect x="630" y="610" width="260" height="60" rx="30" fill="#5da8d4"/>
  <text x="760" y="640" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700" font-size="32">4秒</text>
  <rect x="630" y="682" width="260" height="150" rx="16" fill="#fff" stroke="#5da8d4" stroke-width="3"/>
  <polygon points="746,737 746,777 782,757" fill="#5da8d4"/>
  <text x="760" y="868" text-anchor="middle" fill="#1f2937" font-weight="600" font-size="34">場面2</text>

  <!-- 場面3 -->
  <rect x="910" y="610" width="420" height="60" rx="30" fill="#5da8d4"/>
  <text x="1120" y="640" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700" font-size="32">7秒</text>
  <rect x="910" y="682" width="420" height="150" rx="16" fill="#fff" stroke="#5da8d4" stroke-width="3"/>
  <polygon points="1106,737 1106,777 1142,757" fill="#5da8d4"/>
  <text x="1120" y="868" text-anchor="middle" fill="#1f2937" font-weight="600" font-size="34">場面3</text>

  <!-- 場面4 -->
  <rect x="1350" y="610" width="320" height="60" rx="30" fill="#5da8d4"/>
  <text x="1510" y="640" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700" font-size="32">5秒</text>
  <rect x="1350" y="682" width="320" height="150" rx="16" fill="#fff" stroke="#5da8d4" stroke-width="3"/>
  <polygon points="1496,737 1496,777 1532,757" fill="#5da8d4"/>
  <text x="1510" y="868" text-anchor="middle" fill="#1f2937" font-weight="600" font-size="34">場面4</text>

  <!-- フッターキャッチ -->
  <rect x="160" y="980" width="1600" height="70" rx="35" fill="#fff" stroke="#fde6c1" stroke-width="2"/>
  <circle cx="220" cy="1015" r="10" fill="#f59e0b"/>
  <text x="260" y="1015" dominant-baseline="central" fill="#1f2937" font-weight="600" font-size="34">記事が変わって読み上げが伸び縮みしても、場面の長さが自動でついてくる</text>
</svg>
