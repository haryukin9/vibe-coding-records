<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="画像生成AIはシーンは得意でも図表は苦手だった">
  <rect width="1920" height="1080" fill="#f8f9fa"/>

  <text x="80" y="80" fill="#1f2937" font-weight="700" font-size="62" dominant-baseline="hanging">画像生成AIは「シーン」は得意でも、「図表」は苦手</text>
  <line x1="80" y1="172" x2="280" y2="172" stroke="#f59e0b" stroke-width="5"/>

  <!-- 左カード：得意領域 -->
  <g transform="translate(60, 230)">
    <rect x="0" y="0" width="900" height="720" rx="24" fill="#fff" stroke="#5da8d4" stroke-width="3"/>

    <!-- ヘッダー帯（120px） -->
    <rect x="0" y="0" width="900" height="120" rx="24" fill="#5da8d4"/>
    <rect x="0" y="96" width="900" height="24" fill="#5da8d4"/>

    <!-- アイコン：highlight_star（scale 2.5 = 約60px相当） -->
    <g transform="translate(300, 30) scale(2.5)" fill="#ffffff">
      <path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/>
    </g>

    <!-- タイトル -->
    <text x="384" y="60" fill="#fff" font-weight="700" font-size="54" dominant-baseline="central">得意な領域</text>

    <!-- アイテム -->
    <g transform="translate(70, 200)">
      <circle cx="26" cy="26" r="26" fill="#5da8d4"/>
      <polyline points="14,26 22,34 38,18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="42" fill="#1f2937" font-weight="600" font-size="50">人物のポートレート</text>
    </g>
    <g transform="translate(70, 300)">
      <circle cx="26" cy="26" r="26" fill="#5da8d4"/>
      <polyline points="14,26 22,34 38,18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="42" fill="#1f2937" font-weight="600" font-size="50">風景・自然</text>
    </g>
    <g transform="translate(70, 400)">
      <circle cx="26" cy="26" r="26" fill="#5da8d4"/>
      <polyline points="14,26 22,34 38,18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="42" fill="#1f2937" font-weight="600" font-size="50">雰囲気のあるシーン</text>
    </g>
    <g transform="translate(70, 500)">
      <circle cx="26" cy="26" r="26" fill="#5da8d4"/>
      <polyline points="14,26 22,34 38,18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="42" fill="#1f2937" font-weight="600" font-size="50">モノ・プロダクト</text>
    </g>

    <text x="450" y="650" text-anchor="middle" fill="#3a7ba8" font-weight="700" font-size="46">ひと言で十分なクオリティ</text>
  </g>

  <!-- 右カード：苦手領域 -->
  <g transform="translate(960, 230)">
    <rect x="0" y="0" width="900" height="720" rx="24" fill="#fff" stroke="#9ca3af" stroke-width="3"/>

    <!-- ヘッダー帯（120px） -->
    <rect x="0" y="0" width="900" height="120" rx="24" fill="#6b7280"/>
    <rect x="0" y="96" width="900" height="24" fill="#6b7280"/>

    <!-- アイコン：warning -->
    <g transform="translate(300, 30) scale(2.5)" fill="#ffffff">
      <path d="M4.47 21h15.06c1.54 0 2.5-1.67 1.73-3L13.73 4.99c-.77-1.33-2.69-1.33-3.46 0L2.74 18c-.77 1.33.19 3 1.73 3zM12 14c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1s1 .45 1 1v2c0 .55-.45 1-1 1zm1 4h-2v-2h2v2z"/>
    </g>

    <text x="384" y="60" fill="#fff" font-weight="700" font-size="54" dominant-baseline="central">苦手な領域</text>

    <g transform="translate(70, 200)">
      <circle cx="26" cy="26" r="26" fill="#9ca3af"/>
      <line x1="14" y1="14" x2="38" y2="38" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <line x1="38" y1="14" x2="14" y2="38" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="86" y="42" fill="#374151" font-weight="600" font-size="50">図解・概念図</text>
    </g>
    <g transform="translate(70, 300)">
      <circle cx="26" cy="26" r="26" fill="#9ca3af"/>
      <line x1="14" y1="14" x2="38" y2="38" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <line x1="38" y1="14" x2="14" y2="38" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="86" y="42" fill="#374151" font-weight="600" font-size="50">チャート・グラフ</text>
    </g>
    <g transform="translate(70, 400)">
      <circle cx="26" cy="26" r="26" fill="#9ca3af"/>
      <line x1="14" y1="14" x2="38" y2="38" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <line x1="38" y1="14" x2="14" y2="38" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="86" y="42" fill="#374151" font-weight="600" font-size="50">フロー図・処理の流れ</text>
    </g>
    <g transform="translate(70, 500)">
      <circle cx="26" cy="26" r="26" fill="#9ca3af"/>
      <line x1="14" y1="14" x2="38" y2="38" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <line x1="38" y1="14" x2="14" y2="38" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="86" y="42" fill="#374151" font-weight="600" font-size="50">表組み・料金プラン</text>
    </g>

    <text x="450" y="650" text-anchor="middle" fill="#6b7280" font-weight="700" font-size="46">文字崩れ・矢印崩れ・配置乱れ</text>
  </g>

  <!-- フッターキャッチ -->
  <g>
    <rect x="160" y="990" width="1600" height="70" rx="35" fill="#fff" stroke="#fde6c1" stroke-width="2"/>
    <circle cx="220" cy="1025" r="10" fill="#f59e0b"/>
    <text x="260" y="1025" dominant-baseline="central" fill="#1f2937" font-weight="600" font-size="34">記事は文章だけになり、図表で説明したい場面が抜け落ちる</text>
  </g>
</svg>
