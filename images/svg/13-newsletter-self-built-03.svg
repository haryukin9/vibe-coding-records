<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="できあがった三層構造を同じIDで縦に貫く">
  <rect width="1920" height="1080" fill="#f8f9fa"/>

  <text x="80" y="80" fill="#1f2937" font-weight="700" font-size="62" dominant-baseline="hanging">できあがったのは、同じIDで縦に貫く三層</text>
  <line x1="80" y1="172" x2="280" y2="172" stroke="#f59e0b" stroke-width="5"/>

  <!-- 縦軸：同じID -->
  <rect x="200" y="280" width="100" height="660" rx="20" fill="#fef3e2" stroke="#f59e0b" stroke-width="3"/>
  <text x="250" y="610" text-anchor="middle" dominant-baseline="central" fill="#92400e" font-weight="700" font-size="32" transform="rotate(-90 250 610)">同じIDで一本に</text>

  <!-- 上：反応記録層 -->
  <rect x="380" y="280" width="1440" height="180" rx="24" fill="#fff" stroke="#5da8d4" stroke-width="3"/>
  <rect x="380" y="280" width="380" height="180" rx="24" fill="#5da8d4"/>
  <rect x="728" y="280" width="32" height="180" fill="#5da8d4"/>
  <g transform="translate(409, 334) scale(3.0)" fill="#ffffff">
    <path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>
  </g>
  <text x="511" y="370" dominant-baseline="central" fill="#fff" font-weight="700" font-size="44">反応記録層</text>
  <text x="1280" y="345" text-anchor="middle" dominant-baseline="central" fill="#1f2937" font-weight="700" font-size="38">開封・クリック・問い合わせ</text>
  <text x="1280" y="408" text-anchor="middle" dominant-baseline="central" fill="#6b7280" font-weight="500" font-size="30">秒単位の時系列で保存／機械アクセスを差し引ける</text>

  <!-- 縦の連結線（同じID） -->
  <line x1="1280" y1="460" x2="1280" y2="520" stroke="#f59e0b" stroke-width="6" stroke-dasharray="10 8"/>

  <!-- 中：配信層 -->
  <rect x="380" y="520" width="1440" height="180" rx="24" fill="#fff" stroke="#5da8d4" stroke-width="3"/>
  <rect x="380" y="520" width="380" height="180" rx="24" fill="#5da8d4"/>
  <rect x="728" y="520" width="32" height="180" fill="#5da8d4"/>
  <g transform="translate(453, 574) scale(3.0)" fill="#ffffff">
    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
  </g>
  <text x="555" y="610" dominant-baseline="central" fill="#fff" font-weight="700" font-size="44">配信層</text>
  <text x="1280" y="585" text-anchor="middle" dominant-baseline="central" fill="#1f2937" font-weight="700" font-size="38">Vercel ＋ MailerSend</text>
  <text x="1280" y="648" text-anchor="middle" dominant-baseline="central" fill="#6b7280" font-weight="500" font-size="30">この層だけ差し替えれば、全体は動き続ける</text>

  <!-- 縦の連結線（同じID） -->
  <line x1="1280" y1="700" x2="1280" y2="760" stroke="#f59e0b" stroke-width="6" stroke-dasharray="10 8"/>

  <!-- 下：購読者層 -->
  <rect x="380" y="760" width="1440" height="180" rx="24" fill="#fff" stroke="#5da8d4" stroke-width="3"/>
  <rect x="380" y="760" width="380" height="180" rx="24" fill="#5da8d4"/>
  <rect x="728" y="760" width="32" height="180" fill="#5da8d4"/>
  <g transform="translate(431, 814) scale(3.0)" fill="#ffffff">
    <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
  </g>
  <text x="533" y="850" dominant-baseline="central" fill="#fff" font-weight="700" font-size="44">購読者層</text>
  <text x="1280" y="825" text-anchor="middle" dominant-baseline="central" fill="#1f2937" font-weight="700" font-size="38">Supabase（東京リージョン）</text>
  <text x="1280" y="888" text-anchor="middle" dominant-baseline="central" fill="#6b7280" font-weight="500" font-size="30">登録・配信停止・閲覧履歴を同じIDの下に並べる</text>

  <!-- フッターキャッチ -->
  <rect x="160" y="980" width="1600" height="70" rx="35" fill="#fff" stroke="#fde6c1" stroke-width="2"/>
  <circle cx="220" cy="1015" r="10" fill="#f59e0b"/>
  <text x="260" y="1015" dominant-baseline="central" fill="#1f2937" font-weight="600" font-size="34">配信は外注、土台は自前。お客様情報を一本の軸でつなぐ最初の一本になった</text>
</svg>
