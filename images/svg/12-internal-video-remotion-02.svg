<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="台本づくりは簡単、難所はその先">
  <rect width="1920" height="1080" fill="#f8f9fa"/>

  <text x="80" y="80" fill="#1f2937" font-weight="700" font-size="62" dominant-baseline="hanging">台本づくりは簡単、難所はその先</text>
  <line x1="80" y1="172" x2="280" y2="172" stroke="#f59e0b" stroke-width="5"/>

  <!-- 記事カード -->
  <rect x="70" y="400" width="380" height="240" rx="24" fill="#fff" stroke="#5da8d4" stroke-width="3"/>
  <rect x="70" y="400" width="380" height="86" rx="24" fill="#5da8d4"/>
  <rect x="70" y="456" width="380" height="30" fill="#5da8d4"/>
  <g transform="translate(177, 417) scale(2.2)" fill="#ffffff">
    <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
  </g>
  <text x="254" y="443" text-anchor="start" dominant-baseline="central" fill="#fff" font-weight="700" font-size="44">記事</text>
  <text x="260" y="560" text-anchor="middle" fill="#1f2937" font-weight="600" font-size="40">記事はもう</text>
  <text x="260" y="610" text-anchor="middle" fill="#1f2937" font-weight="600" font-size="40">揃っている</text>

  <!-- 矢印 記事→台本 -->
  <line x1="450" y1="520" x2="516" y2="520" stroke="#3a7ba8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="540,520 514,505 514,535" fill="#3a7ba8"/>

  <!-- 台本カード -->
  <rect x="540" y="400" width="380" height="240" rx="24" fill="#fff" stroke="#5da8d4" stroke-width="3"/>
  <rect x="540" y="400" width="380" height="86" rx="24" fill="#5da8d4"/>
  <rect x="540" y="456" width="380" height="30" fill="#5da8d4"/>
  <g transform="translate(594, 419) scale(2.0)" fill="#ffffff">
    <path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/>
  </g>
  <text x="666" y="443" text-anchor="start" dominant-baseline="central" fill="#fff" font-weight="700" font-size="42">台本づくり</text>
  <text x="730" y="555" text-anchor="middle" fill="#1f2937" font-weight="600" font-size="40">記事を要約する</text>
  <rect x="575" y="583" width="310" height="50" rx="25" fill="#fef3e2" stroke="#f59e0b" stroke-width="2"/>
  <text x="730" y="608" text-anchor="middle" dominant-baseline="central" fill="#1f2937" font-weight="600" font-size="28">AIが得意・かんたん</text>

  <!-- 分岐矢印 台本→難所（直線と直角） -->
  <line x1="920" y1="520" x2="975" y2="520" stroke="#3a7ba8" stroke-width="6" stroke-linecap="round"/>
  <line x1="975" y1="410" x2="975" y2="650" stroke="#3a7ba8" stroke-width="6" stroke-linecap="round"/>
  <line x1="975" y1="410" x2="1004" y2="410" stroke="#3a7ba8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="1030,410 1004,397 1004,423" fill="#3a7ba8"/>
  <line x1="975" y1="650" x2="1004" y2="650" stroke="#3a7ba8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="1030,650 1004,637 1004,663" fill="#3a7ba8"/>

  <!-- 難所① -->
  <rect x="1030" y="320" width="810" height="180" rx="24" fill="#fff" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="1130" cy="410" r="46" fill="#f59e0b"/>
  <text x="1130" y="410" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700" font-size="50">1</text>
  <text x="1210" y="392" fill="#1f2937" font-weight="700" font-size="46">ナレーションと映像のズレ</text>
  <text x="1210" y="452" fill="#6b7280" font-weight="500" font-size="34">読み上げと画面の切り替わりが合わない</text>

  <!-- 難所② -->
  <rect x="1030" y="560" width="810" height="180" rx="24" fill="#fff" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="1130" cy="650" r="46" fill="#f59e0b"/>
  <text x="1130" y="650" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700" font-size="50">2</text>
  <text x="1210" y="632" fill="#1f2937" font-weight="700" font-size="46">素材を毎回手作業で作る</text>
  <text x="1210" y="692" fill="#6b7280" font-weight="500" font-size="34">2本目から楽にならない</text>

  <!-- フッターキャッチ -->
  <rect x="160" y="980" width="1600" height="70" rx="35" fill="#fff" stroke="#fde6c1" stroke-width="2"/>
  <circle cx="220" cy="1015" r="10" fill="#f59e0b"/>
  <text x="260" y="1015" dominant-baseline="central" fill="#1f2937" font-weight="600" font-size="34">むずかしいのは台本の先。映像のズレと、素材の手作業をしくみ化する</text>
</svg>
