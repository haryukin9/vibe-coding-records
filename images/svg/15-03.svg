<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 980" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="1つのネタを、記事・ホワイトペーパー・動画へ展開するマルチメディア活用の図">
  <rect x="0" y="0" width="1920" height="980" fill="#f8f9fa"/>

  <text x="80" y="64" font-family="sans-serif" font-size="60" font-weight="bold" fill="#1f2937" dominant-baseline="hanging">1つのネタを、複数の発信物に展開する</text>
  <line x1="80" y1="156" x2="540" y2="156" stroke="#f59e0b" stroke-width="5"/>

  <!-- 左：1つのネタ -->
  <rect x="120" y="300" width="440" height="400" rx="20" fill="#ffffff" stroke="#5da8d4" stroke-width="3"/>
  <rect x="120" y="300" width="440" height="84" rx="20" fill="#5da8d4"/>
  <rect x="120" y="350" width="440" height="34" fill="#5da8d4"/>
  <g transform="translate(173, 320) scale(1.8)" fill="#ffffff">
    <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/>
  </g>
  <text x="232" y="342" font-family="sans-serif" font-size="56" fill="#ffffff" text-anchor="start" dominant-baseline="central" font-weight="bold">1つのネタ</text>
  <text x="340" y="500" font-family="sans-serif" font-size="46" fill="#374151" text-anchor="middle" dominant-baseline="central">記事のもとになる</text>
  <text x="340" y="578" font-family="sans-serif" font-size="46" fill="#374151" text-anchor="middle" dominant-baseline="central">1つのテーマ</text>

  <!-- 矢印 -->
  <line x1="580" y1="500" x2="730" y2="500" stroke="#3a7ba8" stroke-width="16"/>
  <polygon points="730,466 786,500 730,534" fill="#3a7ba8"/>

  <!-- 右：3つの発信物 -->
  <!-- 記事 -->
  <rect x="820" y="280" width="970" height="170" rx="18" fill="#ffffff" stroke="#5da8d4" stroke-width="3"/>
  <rect x="820" y="280" width="130" height="170" rx="18" fill="#5da8d4"/>
  <rect x="885" y="280" width="65" height="170" fill="#5da8d4"/>
  <g transform="translate(845, 318) scale(2.7)" fill="#ffffff">
    <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
  </g>
  <text x="990" y="343" font-family="sans-serif" font-size="54" fill="#1f2937" text-anchor="start" dominant-baseline="central" font-weight="bold">記事</text>
  <text x="990" y="408" font-family="sans-serif" font-size="40" fill="#6b7280" text-anchor="start" dominant-baseline="central">本文・図解・アイキャッチまで一気に</text>

  <!-- ホワイトペーパー -->
  <rect x="820" y="475" width="970" height="170" rx="18" fill="#ffffff" stroke="#5da8d4" stroke-width="3"/>
  <rect x="820" y="475" width="130" height="170" rx="18" fill="#5da8d4"/>
  <rect x="885" y="475" width="65" height="170" fill="#5da8d4"/>
  <g transform="translate(845, 513) scale(2.7)" fill="#ffffff">
    <path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/>
  </g>
  <text x="990" y="538" font-family="sans-serif" font-size="54" fill="#1f2937" text-anchor="start" dominant-baseline="central" font-weight="bold">ホワイトペーパー</text>
  <text x="990" y="603" font-family="sans-serif" font-size="40" fill="#6b7280" text-anchor="start" dominant-baseline="central">HTML＋PDFで量産</text>

  <!-- 動画 -->
  <rect x="820" y="670" width="970" height="170" rx="18" fill="#ffffff" stroke="#5da8d4" stroke-width="3"/>
  <rect x="820" y="670" width="130" height="170" rx="18" fill="#5da8d4"/>
  <rect x="885" y="670" width="65" height="170" fill="#5da8d4"/>
  <g transform="translate(845, 708) scale(2.7)" fill="#ffffff">
    <path d="M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
  </g>
  <text x="990" y="733" font-family="sans-serif" font-size="54" fill="#1f2937" text-anchor="start" dominant-baseline="central" font-weight="bold">動画</text>
  <text x="990" y="798" font-family="sans-serif" font-size="40" fill="#6b7280" text-anchor="start" dominant-baseline="central">台本→ナレーション→書き出し</text>

  <!-- フッターキャッチ -->
  <rect x="80" y="888" width="1760" height="72" rx="20" fill="#ffffff" stroke="#fde6c1" stroke-width="3"/>
  <circle cx="130" cy="924" r="10" fill="#f59e0b"/>
  <text x="170" y="924" font-family="sans-serif" font-size="34" fill="#374151" dominant-baseline="central">素材とトーンを共有するので、媒体が増えても作る手間はそれほど増えない。</text>
</svg>
